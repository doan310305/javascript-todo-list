<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to do</title>
    <script src="todo-app.js" defer></script>
  </head>
  <body>
    <div class="todo-form">
      <h3>Nhung viec can lam</h3>
      <div class="input-button">
        <input type="text" id="taskInput" placeholder="them viec moi" />
        <button id="addTaskButton">Them</button>
      </div>
      <p class="today">HOM NAY</p>
      <ul id="taskList"></ul>
    </div>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* background-color: rgb(216, 196, 251); */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: rgb(233, 218, 249);
    }
    .todo-form {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      height: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      h3 {
        font-size: 20px;
        margin-bottom: 10px;
      }
      p {
        margin-top: 10px;
        font-size: 10px;
        margin-bottom: 10px;
      }
      #taskList {
        list-style: none;
        margin-top: 16px;
        min-height: 0;
        overflow-y: auto;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid #eceef4;
        border-radius: 10px;
        font-size: 14px;
      }

      .task-item label {
        flex: 1;
      }

      .more-button {
        border: none;
        background: transparent;
        cursor: pointer;
      }
    }
  </style>
</html>
